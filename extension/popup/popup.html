<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>PDF 划词翻译</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h10M9 3v2c0 4.4-2.2 8-5 9"/><path d="M6 10.5c1.4 2 3.3 3.4 5.5 4.2"/><path d="M13 21l4-10 4 10"/><path d="M14.5 17h5"/></svg>
      </div>
      <div class="titles">
        <div class="title">PDF 划词翻译</div>
        <div class="sub" id="statusLine">读取中…</div>
      </div>
      <label class="switch" title="总开关">
        <input type="checkbox" id="enabled" />
        <span class="slider"></span>
      </label>
    </header>

    <section class="tab-card" id="tabCard" hidden>
      <div class="tab-url" id="tabUrl"></div>
      <button class="btn primary" id="openViewerBtn" hidden>在翻译阅读器中打开</button>
      <div class="tab-note" id="tabNote" hidden></div>
    </section>

    <section class="rows">
      <label class="row">
        <span>自动接管 PDF</span>
        <input type="checkbox" id="interceptPdf" class="cb" />
      </label>
      <label class="row">
        <span>网页上也支持划词</span>
        <input type="checkbox" id="enableOnWebPages" class="cb" />
      </label>
      <div class="row">
        <span>翻译引擎</span>
        <select id="engine"></select>
      </div>
    </section>

    <p class="tip">在 PDF 里用鼠标选中英文单词 → 点「译」→ 看中文释义。</p>

    <footer>
      <button class="link" id="openOptions">更多设置</button>
      <span class="ver" id="ver"></span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
