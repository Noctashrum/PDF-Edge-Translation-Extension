<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF 划词翻译</title>
    <!-- pdf.js 组件样式（页面 / 文本层 / 注释层 / 搜索高亮） -->
    <link rel="stylesheet" href="../vendor/pdfjs/web/pdf_viewer.css" />
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <div id="outerContainer">
      <!-- ── 工具栏 ────────────────────────────────────────────── -->
      <header id="toolbar">
        <div class="tb-group">
          <button id="sidebarToggle" class="tb-btn" type="button" title="缩略图 / 大纲 (Ctrl+B)" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
          </button>
          <div class="doc-meta">
            <div id="fileName" class="file-name" title="">打开中…</div>
            <div id="docInfo" class="doc-sub">PDF 划词翻译</div>
          </div>
        </div>

        <div class="tb-group tb-center">
          <button id="pagePrev" class="tb-btn" type="button" title="上一页 (PageUp)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <div class="page-box">
            <input id="pageNumber" class="page-input" type="text" inputmode="numeric" value="1" aria-label="页码" />
            <span class="page-total">/ <span id="pageCount">–</span></span>
          </div>
          <button id="pageNext" class="tb-btn" type="button" title="下一页 (PageDown)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
          </button>
          <span class="tb-sep"></span>
          <button id="zoomOut" class="tb-btn" type="button" title="缩小 (Ctrl+-)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M7.5 10.5h6"/><path d="M15.5 15.5L21 21"/></svg>
          </button>
          <select id="zoomSelect" class="tb-select" title="缩放">
            <option value="auto">自动</option>
            <option value="page-width">适合宽度</option>
            <option value="page-fit">适合页面</option>
            <option value="page-actual">实际大小</option>
            <option value="0.5">50%</option>
            <option value="0.75">75%</option>
            <option value="1">100%</option>
            <option value="1.25">125%</option>
            <option value="1.5">150%</option>
            <option value="2">200%</option>
            <option value="3">300%</option>
            <option value="4">400%</option>
          </select>
          <button id="zoomIn" class="tb-btn" type="button" title="放大 (Ctrl+=)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M7.5 10.5h6M10.5 7.5v6"/><path d="M15.5 15.5L21 21"/></svg>
          </button>
          <button id="rotate" class="tb-btn" type="button" title="向右旋转">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 6"/><path d="M20 4v7h-7"/></svg>
          </button>
        </div>

        <div class="tb-group tb-right">
          <span id="hint" class="hint">选中英文单词 → 点「译」</span>
          <button id="findToggle" class="tb-btn" type="button" title="查找 (Ctrl+F)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
          </button>
          <button id="downloadBtn" class="tb-btn" type="button" title="下载 (Ctrl+S)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M4 20h16"/></svg>
          </button>
          <button id="printBtn" class="tb-btn" type="button" title="打印 (Ctrl+P)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="4" y="9" width="16" height="7" rx="1.5"/><path d="M7 14h10v7H7z"/></svg>
          </button>
          <button id="nativeBtn" class="tb-btn tb-ghost" type="button" title="改用 Edge 内置阅读器打开（本扩展的划词翻译在此模式下不可用）">
            用 Edge 打开
          </button>
          <button id="settingsBtn" class="tb-btn" type="button" title="设置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.6a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.3-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          </button>
        </div>
      </header>

      <!-- ── 查找栏 ────────────────────────────────────────────── -->
      <div id="findbar" hidden>
        <input id="findInput" type="text" placeholder="在文档中查找…" autocomplete="off" spellcheck="false" />
        <span id="findCount" class="find-count"></span>
        <button id="findPrev" class="tb-btn" type="button" title="上一个 (Shift+Enter)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
        </button>
        <button id="findNext" class="tb-btn" type="button" title="下一个 (Enter)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <label class="find-opt"><input id="findCase" type="checkbox" />区分大小写</label>
        <label class="find-opt"><input id="findWord" type="checkbox" />全词</label>
        <button id="findClose" class="tb-btn" type="button" title="关闭 (Esc)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <!-- ── 正文区 ────────────────────────────────────────────── -->
      <div id="mainContainer">
        <aside id="sidebar" hidden>
          <div class="side-tabs">
            <button id="tabThumbs" class="side-tab is-active" type="button">缩略图</button>
            <button id="tabOutline" class="side-tab" type="button">大纲</button>
          </div>
          <div id="thumbnails" class="thumbs"></div>
          <div id="outline" class="outline" hidden></div>
        </aside>
        <div id="viewerContainer" tabindex="0">
          <div id="viewer" class="pdfViewer"></div>
        </div>
      </div>

      <!-- ── 进度 / 错误 / 提示 ─────────────────────────────────── -->
      <div id="loadingBar"><div id="loadingProgress"></div></div>

      <div id="errorOverlay" hidden>
        <div class="err-card">
          <h2 id="errTitle">打不开这个 PDF</h2>
          <p id="errMsg"></p>
          <p id="errHint" class="err-hint"></p>
          <div class="err-actions">
            <button id="errNative" class="btn primary" type="button">用 Edge 内置阅读器打开</button>
            <button id="errRetry" class="btn" type="button">重试</button>
          </div>
        </div>
      </div>

      <div id="toast" hidden></div>
    </div>

    <script src="../shared/bubble.js"></script>
    <script type="module" src="viewer.js"></script>
  </body>
</html>
